apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

// react-native-config: debug builds read .env.development, release builds .env.production
project.ext.envConfigFiles = [
    debug: ".env.development",
    release: ".env.production"
]

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    namespace "com.sktailorenza.thumvo"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.sktailorenza.thumvo"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // React Native core
    implementation("com.facebook.react:react-android")

    // JavaScript engine
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Optionally exclude android.support globally (you can use resolutionStrategy as well)
    configurations.all {
        exclude group: 'com.android.support'
    }
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

// ---- Output file names: <App>-<versionName>.apk / .aab (release), e.g. Thumvo-1.0.0.apk ----
// debug builds get a "-debug" suffix. The bundle keeps its default file and also gets a correctly named copy.
def appFileName = "Thumvo"
def fileSuffix = { String buildType -> buildType == "release" ? "" : "-${buildType}" }

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        outputFileName = "${appFileName}-${variant.versionName}${fileSuffix(variant.buildType.name)}.apk"
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        def bundleTask = tasks.findByName("bundle${variant.name.capitalize()}")
        if (bundleTask != null) {
            bundleTask.doLast {
                def dir = new File(buildDir, "outputs/bundle/${variant.name}")
                def src = new File(dir, "app-${variant.name}.aab")
                if (src.exists()) {
                    def dst = new File(dir, "${appFileName}-${variant.versionName}${fileSuffix(variant.buildType.name)}.aab")
                    java.nio.file.Files.copy(src.toPath(), dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
    }
}
